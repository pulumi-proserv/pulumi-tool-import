dist: goreleaser
project_name: pulumi-tool-import
version: 2
snapshot:
  version_template: "{{ .Version }}-SNAPSHOT"
checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
archives:
- id: archive
  name_template: '{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}'
builds:
- id: pulumi-tool-import
  binary: pulumi-tool-import
  goarch:
  - amd64
  - arm64
  goos:
  - darwin
  - windows
  - linux
  ldflags:
  - -s
  - -w
  - -X github.com/pulumi-proserv/pulumi-tool-import/pkg/version.Version={{.Tag}}
  main: .

# Keyless cosign signing of the checksums file (Sigstore OIDC — no key management).
# Verify: cosign verify-blob --certificate <checksums>.pem --signature <checksums>.sig \
#   --certificate-identity-regexp 'https://github.com/pulumi-proserv/pulumi-tool-import' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com <checksums>
signs:
- cmd: cosign
  signature: "${artifact}.sig"
  certificate: "${artifact}.pem"
  args:
  - sign-blob
  - "--output-signature=${signature}"
  - "--output-certificate=${certificate}"
  - "${artifact}"
  - "--yes"
  artifacts: checksum
  output: true
