name: tool-import-e2e
runtime: yaml
description: >
  Pulumi program mirroring test/e2e/testdata/tf/main.tf, for the
  patch-state-tf-non-importable end-to-end test (test/e2e/e2e_test.go).

  Resource logical (URN) names below match what "resolve tf" derives from
  the Terraform addresses in that fixture: for a resource with no parent
  component, matchChildren (pkg/import_filler.go) matches on
  extractResourceName(terraformAddress), which is the last dot-separated
  segment of the address kept as-is -- brackets included for a
  count-indexed resource, e.g. "aws_route_table.rt[0]" -> "rt[0]"
  (see pkg/import_filler_test.go:TestExtractResourceName).

  Pulumi YAML cannot reference a resource through interpolation syntax
  if its logical name contains brackets -- the expression parser reads
  "[0]" as indexing a list-valued variable named "rt", and there is no
  variable named "rt" (only individually named resources), so
  interpolating "rt[0].id" directly fails with 'resource, variable, or
  config value "rt" not found'. Each bracket-named resource below
  therefore uses an
  interpolation-safe map key (rt0, prop0, ...) and sets its real,
  bracket-bearing logical name through the resource's own "name:" field --
  which is what ends up in the generated import file and what "resolve tf"
  matches against. This was verified locally with
  "pulumi preview --import-file" against this exact file (no AWS
  credentials needed for that -- aws:skipCredentialsValidation) before
  ever running it against real infrastructure.

  That offline check needs one extra step now that "eastProvider" exists:
  an EXPLICIT provider resource does not inherit aws:* stack config, so it
  tries to validate credentials and fails with "unable to validate AWS
  credentials" before any import file is written. To re-run the check, add
  skipCredentialsValidation and skipRequestingAccountId (as booleans, not
  strings) to eastProvider's properties in a COPY of this file -- not here,
  where they would change what the real run exercises.

resources:
  main:
    type: aws:ec2:Vpc
    name: main
    properties:
      cidrBlock: 10.42.0.0/16
      enableDnsHostnames: true
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  rt0:
    type: aws:ec2:RouteTable
    name: "rt[0]"
    properties:
      vpcId: ${main.id}
      tags:
        Name: tool-import-e2e-rt-0
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection
  rt1:
    type: aws:ec2:RouteTable
    name: "rt[1]"
    properties:
      vpcId: ${main.id}
      tags:
        Name: tool-import-e2e-rt-1
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection
  rt2:
    type: aws:ec2:RouteTable
    name: "rt[2]"
    properties:
      vpcId: ${main.id}
      tags:
        Name: tool-import-e2e-rt-2
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  vgw:
    type: aws:ec2:VpnGateway
    name: vgw
    properties:
      vpcId: ${main.id}
      amazonSideAsn: 64512
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  # Non-importable: "resolve tf" drops these three from the generated
  # import file and writes them to the *.non-importable.json sidecar
  # instead. Before injection they must preview as "create"; after
  # "patch-state tf --non-importable" they must preview as "same".
  prop0:
    type: aws:ec2:VpnGatewayRoutePropagation
    name: "prop[0]"
    properties:
      vpnGatewayId: ${vgw.id}
      routeTableId: ${rt0.id}
  prop1:
    type: aws:ec2:VpnGatewayRoutePropagation
    name: "prop[1]"
    properties:
      vpnGatewayId: ${vgw.id}
      routeTableId: ${rt1.id}
  prop2:
    type: aws:ec2:VpnGatewayRoutePropagation
    name: "prop[2]"
    properties:
      vpnGatewayId: ${vgw.id}
      routeTableId: ${rt2.id}

  cgw:
    type: aws:ec2:CustomerGateway
    name: cgw
    properties:
      bgpAsn: 65000
      ipAddress: 203.0.113.1
      type: ipsec.1
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  vpn:
    type: aws:ec2:VpnConnection
    name: vpn
    properties:
      vpnGatewayId: ${vgw.id}
      customerGatewayId: ${cgw.id}
      type: ipsec.1
      staticRoutesOnly: true
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  # Non-importable: the second sidecar entry (see prop0/1/2 above).
  route:
    type: aws:ec2:VpnConnectionRoute
    name: route
    properties:
      destinationCidrBlock: 10.99.0.0/16
      vpnConnectionId: ${vpn.id}

  # Non-importable, and the only resource in this program with Sensitive
  # properties (privateKey/certificatePem/publicKey are secret outputs; caPem
  # is a secret INPUT and is deliberately absent -- see below).
  #
  # This must mirror testdata/tf/main.tf's "aws_iot_certificate" exactly, which
  # sets only "active". caPem was set here to a placeholder string until the
  # e2e run of 2026-08-15, which is when this first became reachable: caPem is
  # ForceNew, so a program declaring it against injected state that correctly
  # has none made the certificate preview as "replace" and reverted the run.
  # That was this file disagreeing with the Terraform config it is supposed to
  # be a translation of, not a tool defect -- "pulumi up" really would have
  # replaced the certificate.
  cert:
    type: aws:iot:Certificate
    name: cert
    properties:
      active: true

  # Backs the LAMBDA-type target group below (see testdata/tf/main.tf for
  # why LAMBDA rather than IP: an IP target with nothing listening behind it
  # never becomes healthy, timing out "tofu apply"). Both are importable and
  # matched by Terraform address (aws_iam_role.lambda, aws_lambda_function.
  # target), so they are imported like main/rt*/vgw/cgw/vpn/tg above --
  # their real, account-specific ARNs are never written into this file,
  # only referenced through interpolation.
  lambdaRole:
    type: aws:iam:Role
    name: lambda
    properties:
      assumeRolePolicy: |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Service": "lambda.amazonaws.com"},
            "Action": "sts:AssumeRole"
          }]
        }
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  # "code" and "sourceCodeHash" mirror testdata/tf/main.tf's "filename" and
  # "source_code_hash". They are load-bearing, not decoration: "pulumi import"
  # cannot write a Lambda's code into state, because AWS returns a presigned
  # download URL rather than the bytes. That is exactly what the curated
  # fields file exists for -- data/aws-import-diff-fields.json marks
  # aws:lambda/function:Function's "code" as "not_read" and reconstructs it
  # as a FileArchive hashed by "source_code_hash" -- so "patch-state" writes
  # a code archive into state. A program declaring none would then disagree
  # with the state the tool just patched, which is what made this Lambda the
  # second failure in the e2e run of 2026-08-15.
  #
  # lambda.zip here is byte-identical to what main.tf's "archive_file" data
  # source generates: the archive provider zeroes entry timestamps, so its
  # output is deterministic (verified by generating it twice). To regenerate
  # after changing the handler source, run that data source alone and copy
  # its output_path here, keeping "sourceCodeHash" in step with its
  # output_base64sha256.
  lambdaFn:
    type: aws:lambda:Function
    name: target
    properties:
      role: ${lambdaRole.arn}
      handler: index.handler
      runtime: nodejs20.x
      code:
        fn::fileArchive: ./lambda.zip
      sourceCodeHash: kwwAvkbUDySp/SXW6Hk7mMS1/G44XcqJwswP2+6lQUU=
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  tg:
    type: aws:vpclattice:TargetGroup
    name: tg
    properties:
      type: LAMBDA
      tags:
        Name: tool-import-e2e
        ManagedBy: pulumi-tool-import-e2e
        Purpose: issue-22-non-importable-injection

  # --- A second provider instance, in a different region.
  #
  # This is what makes the provider-reference resolution observable. The
  # sidecar cannot carry a provider reference (the uuid exists only in the
  # target stack), so injection takes it from the preview's create step. If it
  # took the wrong one, "eastCert" would be injected against us-west-2, where
  # that certificate does not exist, and the preview could not report "same".
  eastProvider:
    type: pulumi:providers:aws
    properties:
      region: us-east-1

  # Non-importable, under the aliased provider (aws.east in main.tf).
  eastCert:
    type: aws:iot:Certificate
    name: east
    properties:
      active: true
    options:
      provider: ${eastProvider}

  # --- Importable; the policy the attachment below refers to.
  iotPolicy:
    type: aws:iot:Policy
    name: policy
    properties:
      name: tool-import-e2e-policy
      policy: |
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["iot:Connect"],"Resource":["*"]}]}

  # Non-importable AND dependent on another non-importable resource: "target"
  # is the certificate's ARN, and "cert" is itself injected. This is the edge
  # orderInjected's topological sort exists for -- VerifyIntegrity rejects a
  # resource whose dependency appears later in the deployment array, so if the
  # sort got this wrong the run would fail loudly rather than subtly.
  policyAttach:
    type: aws:iot:PolicyAttachment
    name: policy_attach
    properties:
      policy: ${iotPolicy.name}
      target: ${cert.arn}

  # --- for_each rather than count. The logical names carry QUOTES inside the
  # brackets ('each["alpha"]'), a shape the count-indexed names above do not
  # have. Same workaround as those: an interpolation-safe map key, with the
  # real logical name in "name:".
  eachAlpha:
    type: aws:iot:Certificate
    name: 'each["alpha"]'
    properties:
      active: true
  eachBeta:
    type: aws:iot:Certificate
    name: 'each["beta"]'
    properties:
      active: true

  # Non-importable, and the only resource in this program with a nested
  # list-of-objects property ("target": {id, port}) -- every other injected
  # resource here is flat top-level strings. "port" is omitted -- it is not
  # applicable to a Lambda target, matching testdata/tf/main.tf.
  attach:
    type: aws:vpclattice:TargetGroupAttachment
    name: attach
    properties:
      targetGroupIdentifier: ${tg.id}
      target:
        id: ${lambdaFn.arn}
