name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags || true
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          # -p 2: build 2 targets at a time. This binary pulls a huge dep tree
          # (OpenTofu, terraform-bridge, AWS SDK v1+v2, Pulumi SDK); building all
          # 6 targets concurrently (-p 10) OOM-killed the 16GB runner.
          args: release --clean -p 2 -f .goreleaser.yml --skip=validate --timeout 60m0s
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
