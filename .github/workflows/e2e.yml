name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Per-ref groups: pushes to one branch queue behind each other without
# evicting other branches' (or main's) runs from the shared queue. Never
# cancel a run mid-apply — that orphans AWS resources; a superseded run
# finishes and tears itself down.
#
# Runs from different refs execute concurrently against the same account.
# That is safe because every AWS-unique name in the fixture carries the run
# ID (see test/e2e/testdata/tf/main.tf, var.run_id), but the account's
# default quotas — 5 VPCs and 5 VPN gateways per region — cap it at roughly
# four simultaneous runs, fewer if an orphan is sitting in the account.
concurrency:
  group: aws-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: AWS e2e
    # Credentials are minted for this job; never run PR-authored code from a
    # fork with them (fork PRs also cannot get id-token: write).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.259.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5

      # Namespaced away from test.yml's cache: this job executes the cached
      # provider binaries with live credentials, so it must not restore
      # entries written by the uncredentialed workflow.
      - name: Cache provider downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pulumi/plugins
            ~/.pulumi/dynamic_tf_plugins
            ~/.pulumi/mapping-cache
            ~/.terraform.d/plugin-cache
          key: e2e-providers-${{ runner.os }}-${{ hashFiles('go.sum', 'pkg/providermap/**', '**/.terraform.lock.hcl') }}
          restore-keys: |
            e2e-providers-${{ runner.os }}-

      - name: Enable the Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"

      - name: Authenticate with Pulumi Cloud via OIDC
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2
        with:
          organization: team-ce
          requested-token-type: urn:pulumi:token-type:access_token:organization

      # The environment is opened ONCE and its values exported to the job:
      # each `pulumi env run` invocation would mint fresh credentials that no
      # registered mask covers, so masking only works if the same credential
      # set is used throughout. Credential-shaped values are masked before
      # anything can print them.
      #
      # team-ce/pulumi-tool-import/e2e imports the AWS environment and holds
      # the tokens the TestRemoteState* tests read their fixture workspaces with.
      - name: Load credentials from ESC (masked)
        run: |
          # Streamed straight through jq so the decrypted document never
          # touches the runner's disk.
          set -o pipefail
          while IFS=$'\t' read -r k v; do
            # The OIDC step above already set PULUMI_ACCESS_TOKEN; letting the
            # environment replace it (or anything else already set) would
            # silently change which principal the rest of the job runs as.
            if [ -n "${!k:-}" ]; then
              echo "::error::ESC environment defines $k, which the job already sets"
              exit 1
            fi
            case "$k" in
              *KEY*|*SECRET*|*TOKEN*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
            echo "$k=$v" >> "$GITHUB_ENV"
          done < <(pulumi env open team-ce/pulumi-tool-import/e2e --format json \
                   | jq -r '(.environmentVariables // {}) | to_entries[] | "\(.key)\t\(.value)"')

      # Fails the job when the credentials do not work: the suite itself
      # t.Skips in that case and go test exits 0, which would otherwise leave
      # this gate green while testing nothing. Also masks the account
      # identity before any test output prints it.
      - name: Verify AWS credentials
        run: |
          id=$(aws sts get-caller-identity --query '[Account,Arn]' --output text)
          acct=$(echo "$id" | awk '{print $1}')
          arn=$(echo "$id" | awk '{print $2}')
          echo "::add-mask::$acct"
          echo "::add-mask::$arn"

      # Same reasoning for the remote-state tokens: TestRemoteState* skip when
      # a token is missing, so a dead or renamed credential would otherwise
      # leave the gate green having tested nothing. Skipped when the suite is
      # switched off, since the tokens are then deliberately unused.
      - name: Verify remote-state credentials
        if: vars.REMOTE_STATE_E2E != 'off'
        run: |
          check() {
            local name=$1 url=$2
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty; the ESC environment did not supply it"
              exit 1
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${!name}" "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$name does not read its fixture workspace: GET $url -> $code"
              exit 1
            fi
          }
          check TFC_TOKEN https://app.terraform.io/api/v2/organizations/import-tool-test/workspaces/tool-import-e2e
          check PULUMI_ACCESS_TOKEN https://tf.pulumi.com/api/v2/organizations/team-ce/workspaces/toolimport_e2e
          check SCALR_TOKEN https://pulumi-proserv.scalr.io/api/tfe/v2/organizations/env-v0pdr54u1htkjaue6/workspaces/tool-import-e2e

      - name: Run e2e tests
        id: e2e
        # E2E_TIMEOUT well under timeout-minutes: the Go-level timeout prints
        # the recovery path and must always fire before the job-level kill,
        # which would skip t.Cleanup's tofu destroy.
        env:
          E2E_TIMEOUT: 30m
          # Repository variable; set it to "off" to skip the tests that hit
          # Terraform Cloud, Pulumi Cloud, and Scalr without a workflow change,
          # e.g. during a vendor outage. Unset means on.
          REMOTE_STATE_E2E: ${{ vars.REMOTE_STATE_E2E }}
        run: make test-e2e

      # A failed or cancelled run can leave real AWS resources behind with
      # their Terraform state in the runner's tempdir. Preserve the state,
      # then destroy best-effort before the runner (and the state) vanish.
      - name: Upload leaked fixture state
        if: always() && steps.e2e.outcome != 'success' && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tf-fixtures
          path: /tmp/pulumi-tool-import-e2e-tf-*
          if-no-files-found: ignore

      - name: Emergency teardown of leaked fixtures
        if: always() && steps.e2e.outcome != 'success' && steps.e2e.outcome != 'skipped'
        run: |
          shopt -s nullglob
          for d in /tmp/pulumi-tool-import-e2e-tf-*/tf; do
            echo "destroying fixtures in $d"
            tofu -chdir="$d" destroy -auto-approve || true
          done
