name: Archive policy proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gobra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - name: Verify production policy and reject mutations
        env:
          CONTAINER_RUNTIME: podman
        run: make verify-archive-policy-mutations
