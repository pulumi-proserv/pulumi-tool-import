name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3

      # The e2e sources are behind "//go:build e2e", so the run above does not
      # see them and neither does "go test ./..." — 2,500+ lines that no job
      # ever compiled. Two real bugs lived there undetected (a cleanup ordering
      # error that disabled the AWS-side orphan sweep on every successful run,
      # and an IAM error-code match that could never fire), and neither a green
      # offline suite nor a green e2e run could surface them. This needs no AWS
      # credentials and takes seconds.
      - name: golangci-lint (e2e build)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --build-tags e2e ./test/e2e/...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l . | grep -v -E '^(docs)/' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

      # "go vet" fully type-checks, so this is what catches a compile error in
      # an e2e-tagged file — otherwise the first thing to notice is a run that
      # has already spent ~16 minutes and real AWS spend. See the e2e lint step
      # for why the tagged build needs its own invocation.
      - name: go vet (e2e build)
        run: go vet -tags e2e ./test/e2e/...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          repo-checkout: false
